<!--
  在这里添加自定义的页脚 HTML 内容（例如 ICP 备案号、公安备案图标与链接、自定义声明等）。
  需要在 src/config/footerConfig.ts 中保持 enable: true；
  内容将注入在页脚版权信息上方；若文件留空或仅保留注释，则不会产生任何额外的 DOM 结构。

  注意：主题在桌面/移动两种布局下各渲染一个页脚（靠 CSS 切换显示），
  所以这段 HTML 会被输出两次。脚本必须用 IIFE 隔离作用域，
  并且只创建一个定时器，否则会触发 `Identifier 'start' has already been declared`。
-->
<div style="text-align: center; margin-bottom: 10px;">
  <span>本站由 <a href="https://astro.build/">Astro</a> 驱动</span>
  ·
  <a href="/rss.xml">RSS 订阅</a>
  |
  本站已运行
  <span class="site-days">…</span>
  天
  |
  <a href="https://beian.miit.gov.cn" target="_blank">冀ICP备2025114767号-3</a>
  ·
  <a href="https://icp.gov.moe/?keyword=20261029" target="_blank">萌ICP备20261029号</a>
</div>
<script>
  (() => {
    const start = new Date("2026-10-30").getTime();
    // 两个页脚实例各有一份 .site-days；Swup 切页后桌面实例会被重建，
    // 所以每次都全量刷新，而不是只抓第一个元素。
    const tick = () => {
      const days = String(Math.floor((Date.now() - start) / 86400000));
      for (const el of document.querySelectorAll(".site-days")) {
        el.textContent = days;
      }
    };
    tick();
    // 第二个实例到这里直接退出，避免重复建定时器
    if (window.__siteDaysTimer) return;
    window.__siteDaysTimer = setInterval(tick, 3600000);
    document.addEventListener("swup:page:view", tick);
  })();
</script>
